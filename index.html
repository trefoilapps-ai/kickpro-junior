    (function initPWA() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0B1E3D"/>
              <stop offset="100%" stop-color="#1E4480"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="112" fill="url(#g)"/>
          <polygon points="256,64 420,148 388,356 256,448 124,356 92,148" fill="none" stroke="#38BDF8" stroke-width="18"/>
          <circle cx="256" cy="252" r="92" fill="none" stroke="#A3E635" stroke-width="20"/>
          <polygon points="256,204 300,236 283,288 229,288 212,236" fill="#A3E635"/>
        </svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));

        const manifest = {
          name: 'KickPro Junior — Футбольное развитие',
          short_name: 'KickPro Jr',
          description: 'Индивидуальное развитие юных футболистов 6–12 лет (оффлайн PWA)',
          start_url: './',
          display: 'standalone',
          background_color: '#07142B',
          theme_color: '#0B1E3D',
          orientation: 'portrait-primary',
          icons: [
            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // Register Offline-First Service Worker via Blob where supported
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
          const swCode = `
            const CACHE_NAME = 'kickpro-junior-v1';
            self.addEventListener('install', (e) => {
              self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (e) => {
              if (e.request.method !== 'GET') return;
              e.respondWith(
                caches.open(CACHE_NAME).then((cache) =>
                  cache.match(e.request).then((cached) => {
                    const fetched = fetch(e.request).then((res) => {
                      if (res && res.status === 200) {
                        cache.put(e.request, res.clone());
                      }
                      return res;
                    }).catch(() => cached);
                    return cached || fetched;
                  })
                )
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {
            // Fallback silently on sandboxed iframes where blob SW scope is restricted
          });
        }
      } catch (err) {
        console.warn('PWA init fallback:', err);
      }
    })();

    const STORAGE_KEY = 'kickpro_junior_state_v1';

    function getTodayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getCurrentWeekDates() {
      const now = new Date();
      const day = now.getDay(); // 0 = Sun
      const diffToMon = (day === 0 ? -6 : 1 - day);
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMon);
      const res = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        res.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
      }
      return res;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
          // Seed realistic demo weekly rhythm
          const week = getCurrentWeekDates();
          fresh.weeklyLog[week[0]] = 'group';
          fresh.weeklyLog[week[1]] = 'solo';
          fresh.weeklyLog[week[2]] = 'group';
          fresh.weeklyLog[week[3]] = 'rest';
          return fresh;
        }
        const parsed = JSON.parse(raw);
        // Safe non-destructive migration
        const merged = {
          ...DEFAULT_STATE,
          ...parsed,
          schemaVersion: CURRENT_SCHEMA_VERSION,
          profile: { ...DEFAULT_STATE.profile, ...(parsed.profile || {}) },
          todayPlan: { ...DEFAULT_STATE.todayPlan, ...(parsed.todayPlan || {}) },
          weeklyLog: { ...(parsed.weeklyLog || {}) },
          assessment: {
            ...DEFAULT_STATE.assessment,
            ...(parsed.assessment || {}),
            scores: { ...DEFAULT_STATE.assessment.scores, ...((parsed.assessment && parsed.assessment.scores) || {}) },
            history: Array.isArray(parsed.assessment?.history) ? parsed.assessment.history : []
          }
        };
        return merged;
      } catch (e) {
        console.error('State load error, using fallback:', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function calculateAgeDetails(birthYear, birthMonth) {
      const now = new Date();
      const curYear = now.getFullYear();
      const curMonth = now.getMonth() + 1;
      let totalMonths = (curYear - birthYear) * 12 + (curMonth - birthMonth);
      if (totalMonths < 48) totalMonths = 48; // min 4y safety
      const years = Math.floor(totalMonths / 12);
      const remMonths = totalMonths % 12;
      let ageGroup = '9-10';
      if (years <= 8) ageGroup = '6-8';
      else if (years <= 10) ageGroup = '9-10';
      else ageGroup = '11-12';
      return { totalMonths, years, remMonths, ageGroup };
    }

    function suggestPlayerType(heightCm, weightKg, ageYears) {
      const h = Number(heightCm) || 135;
      const w = Number(weightKg) || 30;
      const bmi = w / Math.pow(h / 100, 2);
      // Age-adjusted youth athletic heuristic
      const expectedBmi = 15.2 + Math.max(0, (ageYears - 6)) * 0.45;
      const diff = bmi - expectedBmi;

      let suggested = 'balanced';
      if (diff <= -0.9) suggested = 'agile';
      else if (diff >= 1.2) suggested = 'power';

      const reason = {
        ru: {
          agile: `Рост ${h} см / вес ${w} кг (лёгкий атлетичный профиль): высокая манёвренность и стартовая резкость.`,
          balanced: `Рост ${h} см / вес ${w} кг (гармоничное соотношение): отлично подходит для универсального развития.`,
          power: `Рост ${h} см / вес ${w} кг (плотный силовой профиль): хорошее преимущество в укрывании мяча корпусом.`
        },
        kz: {
          agile: `Бойы ${h} см / салмағы ${w} кг (жеңіл атлетикалық профиль): жоғары ептілік пен бастапқы жылдамдық.`,
          balanced: `Бойы ${h} см / салмағы ${w} кг (үйлесімді қатынас): әмбебап дамуға өте қолайлы.`,
          power: `Бойы ${h} см / салмағы ${w} кг (мығым күштік профиль): допты денемен жабуда жақсы артықшылық.`
        },
        en: {
          agile: `Height ${h}cm / Weight ${w}kg (light athletic build): natural agility and quick first-step acceleration.`,
          balanced: `Height ${h}cm / Weight ${w}kg (harmonious proportion): ideal for well-rounded all-court development.`,
          power: `Height ${h}cm / Weight ${w}kg (strong compact build): natural advantage in shielding and physical duels.`
        }
      };

      return {
        suggested,
        text: reason[state.lang]?.[suggested] || reason.ru[suggested]
      };
    }

    function getAdaptedDosage(drill, profile) {
      const age = calculateAgeDetails(profile.birthYear, profile.birthMonth);
      const lvl = profile.level || 'B';
      let mult = 1;
      let restSec = 30;
      let sets = 3;
      if (lvl === 'C') { mult = 0.8; restSec = 40; sets = 2; }
      if (lvl === 'A') { mult = 1.2; restSec = 20; sets = 4; }
      if (age.ageGroup === '6-8') { sets = Math.max(2, sets - 1); restSec += 10; }

      const mins = Math.max(3, Math.min(11, Math.round(drill.baseMin * mult)));
      const dict = {
        ru: `${mins} мин • ${sets} серии • отдых ${restSec} сек (${lvl === 'A' ? 'высокий темп' : lvl === 'B' ? 'рабочий темп' : 'спокойный темп'})`,
        kz: `${mins} мин • ${sets} серия • демалыс ${restSec} сек (${lvl === 'A' ? 'жоғары қарқын' : lvl === 'B' ? 'жұмыс қарқыны' : 'баяу қарқын'})`,
        en: `${mins} min • ${sets} sets • ${restSec}s rest (${lvl === 'A' ? 'high tempo' : lvl === 'B' ? 'steady tempo' : 'learning pace'})`
      };
      return { mins, text: dict[state.lang] || dict.ru };
    }

    function generateWorkoutPlan(profile, excludeIds = []) {
      const age = calculateAgeDetails(profile.birthYear, profile.birthMonth);
      const blocks = ['warmup', 'type_focus', 'skill', 'game', 'cooldown'];
      const chosen = [];

      blocks.forEach((b) => {
        let candidates = DRILLS_DB.filter(d => d.block === b && d.ages.includes(age.ageGroup));
        if (b === 'type_focus') {
          const typed = candidates.filter(d => d.type === profile.playerType);
          if (typed.length) candidates = typed;
        } else {
          const matchedOrAll = candidates.filter(d => d.type === profile.playerType || d.type === 'all');
          if (matchedOrAll.length) candidates = matchedOrAll;
        }
        const filtered = candidates.filter(d => !excludeIds.includes(d.id) && !chosen.includes(d.id));
        const pool = filtered.length ? filtered : candidates;
        const pick = pool[Math.floor(Math.random() * pool.length)] || DRILLS_DB[0];
        chosen.push(pick.id);
      });

      return chosen;
    }

    // Ensure today's plan matches current date or valid IDs
    if (!state.todayPlan || !Array.isArray(state.todayPlan.drillIds) || state.todayPlan.drillIds.length !== 5) {
      state.todayPlan = {
        date: getTodayISO(),
        drillIds: generateWorkoutPlan(state.profile),
        completedIds: []
      };
      saveState();
    }

    function showToast(message, tone = 'lime') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const borderCol = tone === 'amber' ? 'border-amber-400/60 bg-slate-900/95 text-amber-200' : 'border-[#A3E635]/60 bg-[#0B1E3D]/95 text-white';
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-sm font-medium flex items-center gap-2.5 transition-all duration-300 ${borderCol}`;
      el.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${tone === 'amber' ? 'bg-amber-400' : 'bg-[#A3E635]'} shrink-0"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

      const root = document.getElementById('modal-root');

          ${htmlContent}
        </div>
      `;
      root.classList.remove('hidden');
      root.classList.add('flex');
      root.onclick = closeModal;
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');

    let timerState = {
      running: false,
      seconds: 0,
      intervalId: null
    };

    function toggleWorkoutTimer() {
      if (timerState.running) {
        clearInterval(timerState.intervalId);
        timerState.running = false;
      } else {
        timerState.running = true;
        timerState.intervalId = setInterval(() => {
          timerState.seconds += 1;
          const el = document.getElementById('workout-timer-display');
          if (el) el.textContent = formatTimer(timerState.seconds);
        }, 1000);
      }
      renderApp();
    }

    function resetWorkoutTimer() {
      clearInterval(timerState.intervalId);
      timerState.running = false;
      timerState.seconds = 0;
      renderApp();
    }

    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function replaceTodayDrill(index) {
      const currentId = state.todayPlan.drillIds[index];
      const currentDrill = DRILLS_DB.find(d => d.id === currentId);
      const age = calculateAgeDetails(state.profile.birthYear, state.profile.birthMonth);
      const block = currentDrill ? currentDrill.block : 'skill';

      let pool = DRILLS_DB.filter(d => d.block === block && !state.todayPlan.drillIds.includes(d.id) && d.ages.includes(age.ageGroup));
      if (!pool.length) {
        pool = DRILLS_DB.filter(d => d.block === block && d.id !== currentId);
      }
      if (pool.length) {
        const next = pool[Math.floor(Math.random() * pool.length)];
        state.todayPlan.drillIds[index] = next.id;
        state.todayPlan.completedIds = state.todayPlan.completedIds.filter(id => id !== currentId);
        saveState();
        renderApp();
        showToast(next[state.lang]?.title || next.ru.title);
      }
    }

    function computeAssessmentSummary() {

      const tech = avg([s.t_dribbling, s.t_firstTouch, s.t_passing, s.t_shooting, s.t_weakFoot]);

      const physical = avg([s.p_speed, s.p_coordination, s.p_balance]);
      const character = avg([s.c_effort, s.c_resilience, s.c_focus, s.c_teamwork]);

      const skillLabels = {
        ru: {
          t_dribbling: 'Ведение и обводка',
          t_firstTouch: 'Первое касание',
          t_passing: 'Точность паса',
          t_shooting: 'Удар по воротам',
          t_weakFoot: 'Игра слабой ногой',
          tac_decisions: 'Игровые решения',
          tac_positioning: 'Выбор позиции',
          tac_offBall: 'Открывание без мяча',
          tac_transition: 'Реакция после потери мяча',

          p_coordination: 'Координация и ловкость',
          p_balance: 'Устойчивость в контакте',

          c_resilience: 'Спокойная реакция на ошибки',
          c_focus: 'Внимание на тренировке',
          c_teamwork: 'Командное взаимодействие'
        },
        kz: {
          t_dribbling: 'Доп алып жүру және алдау',
          t_firstTouch: 'Бірінші жанасу',
          t_passing: 'Пас дәлдігі',
          t_shooting: 'Қақпаға соққы',
          t_weakFoot: 'Әлсіз аяқпен ойын',
          tac_decisions: 'Ойын шешімдері',
          tac_positioning: 'Позиция таңдау',
          tac_offBall: 'Допсыз ашылу',
          tac_transition: 'Допты жоғалтқаннан кейінгі әрекет',
          p_speed: 'Жылдамдық және шапшаңдық',
          p_coordination: 'Үйлесімділік және ептілік',
          p_balance: 'Түйісудегі тұрақтылық',
          c_effort: 'Ынта мен құлшыныс',
          c_resilience: 'Қателікке сабырлы көзқарас',
          c_focus: 'Жаттығудағы зейін',
          c_teamwork: 'Командалық өзара әрекет'
        },
        en: {
          t_dribbling: 'Dribbling & 1v1',
          t_firstTouch: 'First Touch Control',
          t_passing: 'Passing Accuracy',
          t_shooting: 'Finishing & Striking',
          t_weakFoot: 'Weak-Foot Confidence',
          tac_decisions: 'Decision Making',
          tac_positioning: 'Spatial Positioning',
          tac_offBall: 'Off-Ball Movement',
          tac_transition: 'Reaction After Turnover',
          p_speed: 'Speed & Acceleration',
          p_coordination: 'Agility & Coordination',
          p_balance: 'Contact Balance',
          c_effort: 'Effort & Passion',
          c_resilience: 'Mistake Resilience',
          c_focus: 'Training Focus',
          c_teamwork: 'Team Communication'
        }
      };

      const labels = skillLabels[state.lang] || skillLabels.ru;
      const entries = Object.keys(labels).map(k => ({ key: k, label: labels[k], val: s[k] || 3 }));
      const sortedDesc = [...entries].sort((a, b) => b.val - a.val);
      const sortedAsc = [...entries].sort((a, b) => a.val - b.val);

      const strengths = sortedDesc.slice(0, 3);
      const priorities = sortedAsc.slice(0, 4);

      const tipsMap = {
        ru: {
          t_weakFoot: 'Добавляй 5 минут игры только слабой ногой в каждой разминке.',
          t_firstTouch: 'Тренируй приём мяча сразу в сторону (в шаг), а не остановку на месте.',

          p_balance: 'Play tight 1v1 shielding duels using a low, balanced athletic stance.',
          default: 'Keep football joyful with a steady rhythm: 3 team + 2 short solo sessions weekly.'
        }
      };

      const tDict = tipsMap[state.lang] || tipsMap.ru;
      const advice = priorities.slice(0, 3).map(p => tDict[p.key] || tDict.default);

      return { tech, tactics, physical, character, strengths, priorities, advice };
    }

    async function downloadScoutCardPNG() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 900;
        canvas.height = 1220;
        const ctx = canvas.getContext('2d');

        const summary = computeAssessmentSummary();
        const age = calculateAgeDetails(state.profile.birthYear, state.profile.birthMonth);
        const typeLabel = state.profile.playerType === 'agile'
          ? `⚡ ${t('typeAgile')}`
          : state.profile.playerType === 'power'
          ? `🛡️ ${t('typePower')}`
          : `⚙️ ${t('typeBalanced')}`;

        // Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 900, 1220);
        grad.addColorStop(0, '#07142B');
        grad.addColorStop(0.5, '#0F2752');
        grad.addColorStop(1, '#081834');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 900, 1220);

        // Bespoke KickPro Geometric Border Frame (Not FIFA shield)

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let curY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, curY);
          line = words[n] + ' ';
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
    }

    function handlePhotoUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        // Resize image cleanly to keep localStorage lightweight
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const size = 240;
          c.width = size;
          c.height = size;
          const ctx = c.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          const dataUrl = c.toDataURL('image/jpeg', 0.82);
          state.assessment.photoData = dataUrl;
          state.profile.photoData = dataUrl;
          saveState();
          renderApp();
          showToast('Фото обновлено!');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveProfileFromForm(e) {
      e.preventDefault();
      const form = e.target;
      state.profile.name = form.name.value.trim() || 'Player';
      state.profile.birthYear = Number(form.birthYear.value) || 2016;
      state.profile.birthMonth = Number(form.birthMonth.value) || 1;
      state.profile.heightCm = Number(form.heightCm.value) || 135;
      state.profile.weightKg = Number(form.weightKg.value) || 30;
      state.profile.foot = form.foot.value;
      state.profile.playerType = form.playerType.value;
      state.profile.level = form.level.value;

      // Refresh today's workout to match updated profile
      state.todayPlan = {
        date: getTodayISO(),
        drillIds: generateWorkoutPlan(state.profile),
        completedIds: []
      };
      saveState();
      renderApp();
      showToast(t('saveProfile') + ' ✓');
    }

    function applySuggestedType(typeKey) {
      state.profile.playerType = typeKey;
      state.todayPlan = {
        date: getTodayISO(),
        drillIds: generateWorkoutPlan(state.profile),
        completedIds: []
      };
      saveState();
      renderApp();
      showToast(t('applyHint') + ' ✓');
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `KickPro_Junior_Backup_${getTodayISO()}.json`;
      a.click();
      showToast('JSON-копия скачана!');
    }

    function importBackupJSON(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.profile) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            state = loadState();
            renderApp();
            showToast('Данные успешно восстановлены!');
          }
        } catch (err) {
          showToast('Неверный формат файла JSON', 'amber');
        }
      };
      reader.readAsText(file);
    }

          {

      const rondoGuides = {

            cue: 'Мақсат: жылдамдықта бағыт өзгерту және допты жоғалтқаннан кейінгі жылдам реакция.'

          },
          {

          {

          },
          {
            title: '1v1 Transition Waves (All Ages)',

      };

      let contentHtml = '';
      if (sub === 'ages') {
        contentHtml = `
          <div class="space-y-3.5">
            ${(ageGuides[state.lang] || ageGuides.ru).map(item => `
              <div class="glass-panel rounded-3xl p-4 sm:p-6">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                  <h3 class="text-base sm:text-lg font-black text-white">${item.age}</h3>

                </div>
                <ul class="space-y-2 mt-3 text-xs sm:text-sm text-slate-200">

      } else if (sub === 'types') {
        contentHtml = `
          <div class="space-y-3.5">

              <div class="glass-panel rounded-3xl p-4 sm:p-6 space-y-2.5">
                <h3 class="text-base sm:text-lg font-black text-white">${tp.badge}</h3>

          <div class="space-y-3.5">

              <svg viewBox="0 0 320 150" class="w-full h-40 rounded-2xl bg-[#07142B] border border-sky-400/20">
                <rect x="60" y="18" width="200" height="114" rx="10" fill="#0B2347" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
                <!-- Outside attackers -->
                <circle cx="160" cy="18" r="11" fill="#A3E635"/><text x="160" y="22" text-anchor="middle" font-size="10" font-weight="900" fill="#0B1E3D">A1</text>
                <circle cx="260" cy="75" r="11" fill="#A3E635"/><text x="260" y="79" text-anchor="middle" font-size="10" font-weight="900" fill="#0B1E3D">A2</text>
                <circle cx="160" cy="132" r="11" fill="#A3E635"/><text x="160" y="136" text-anchor="middle" font-size="10" font-weight="900" fill="#0B1E3D">A3</text>
                <circle cx="60" cy="75" r="11" fill="#A3E635"/><text x="60" y="79" text-anchor="middle" font-size="10" font-weight="900" fill="#0B1E3D">A4</text>
                <!-- Defenders -->
                <circle cx="145" cy="72" r="11" fill="#F87171"/><text x="145" y="76" text-anchor="middle" font-size="10" font-weight="900" fill="#FFF">D1</text>
                <circle cx="182" cy="82" r="11" fill="#F87171"/><text x="182" y="86" text-anchor="middle" font-size="10" font-weight="900" fill="#FFF">D2</text>
                <!-- Passing lanes -->
                <line x1="72" y1="70" x2="148" y2="23" stroke="#FFFFFF" stroke-width="2"/>

                <circle cx="80" cy="66" r="5" fill="#FFFFFF"/>
              </svg>
            </div>

            ${(rondoGuides[state.lang] || rondoGuides.ru).map(r => `
              <div class="glass-panel rounded-3xl p-4 sm:p-5">

                  <h3 class="text-base font-black text-white">${r.title}</h3>
                  <span class="px-2.5 py-1 rounded-xl bg-[#07142B] text-sky-300 text-xs font-bold border border-sky-500/20">${r.grid}</span>

      return `
        <div class="px-3 sm:px-6 pt-4 space-y-4">
          <div class="glass-panel rounded-3xl p-4 sm:p-6">
            <div class="flex items-center justify-between gap-2 mb-3">
              <div>
                <h1 class="text-xl sm:text-2xl font-black text-white">📋 ${t('coachTitle')}</h1>

            <div class="grid grid-cols-3 gap-2">

                { id: 'ages', label: t('coachTabAges') },

              ].map(tb => `
                <button onclick="setCoachSubTab('${tb.id}')" class="py-2.5 px-3 rounded-2xl text-xs sm:text-sm font-extrabold transition ${
                  sub === tb.id
                    ? 'bg-[#38BDF8] text-[#0B1E3D] shadow'
                    : 'bg-[#07142B] text-slate-300 border border-sky-500/20 hover:bg-[#132D56]'

        </div>
      `;
    }

    // --------------------------------------------------------------------------
    // 11. MAIN RENDER ORCHESTRATOR
    // --------------------------------------------------------------------------
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      let mainContent = '';
      if (state.mode === 'coach') {
        mainContent = renderCoachMode();
      } else {
        if (state.activeTab === 'today') mainContent = renderTodayTab();
        else if (state.activeTab === 'catalog') mainContent = renderCatalogTab();
        else if (state.activeTab === 'map') mainContent = renderDevelopmentMapTab();
        else mainContent = renderProfileTab();
      }

      app.innerHTML = `
        ${renderHeader()}
        ${state.mode === 'parent' ? renderParentDesktopNav() : ''}
        <main class="flex-1">
          ${mainContent}
        </main>
        ${renderMobileBottomNav()}
      `;
    }

    // Boot application on window load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    // Immediate render fallback if DOM already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
